<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hogaan — Check your inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hogaan: {
                bg: '#FAF6F1',
                card: '#FFFFFF',
                sunken: '#F3EDE4',
                text: '#0A1F4D',
                mute: '#6B6B7A',
                soft: '#9090A0',
                accent: '#C49B4A',
                'accent-light': '#E8D5A8',
                'accent-tint': '#F5EAD0',
              },
              hw: { navy: '#00004D', blue: '#0086FF' },
            },
            fontFamily: { display: ['Fraunces', 'serif'], body: ['Inter', 'sans-serif'] },
            boxShadow: {
              card: '0 2px 8px rgba(10, 31, 77, 0.06)',
              'card-lg': '0 4px 16px rgba(10, 31, 77, 0.08)',
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-display {
        font-family: 'Fraunces', serif;
      }
      .wordmark-underline {
        position: relative;
        display: inline-block;
      }
      .wordmark-underline::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 12%;
        right: 12%;
        height: 2px;
        background: #c49b4a;
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="bg-hogaan-bg text-hogaan-text min-h-screen flex flex-col">
    <!-- Top -->
    <header class="max-w-6xl mx-auto px-6 py-6 w-full">
      <a href="landing.html" class="inline-block">
        <span class="font-display text-2xl font-semibold tracking-tight wordmark-underline"
          >Hogaan</span
        >
      </a>
    </header>

    <!-- Center card -->
    <main class="flex-1 flex items-center justify-center px-6 pb-20">
      <div class="bg-hogaan-card rounded-3xl shadow-card-lg max-w-md w-full p-10 text-center">
        <!-- Icon -->
        <div
          class="w-16 h-16 mx-auto bg-hogaan-accent-tint rounded-2xl flex items-center justify-center mb-6"
        >
          <svg
            class="w-8 h-8 text-hogaan-accent"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </div>

        <h1 class="font-display text-3xl font-medium text-hogaan-text mb-3">Check your inbox.</h1>
        <p class="text-hogaan-mute leading-relaxed mb-1">We sent a sign-in link to</p>
        <p class="text-hogaan-text font-medium mb-6">khadija@example.com</p>

        <p class="text-sm text-hogaan-soft leading-relaxed mb-8">
          Click the link in the email to start your first coaching session. It expires in 15
          minutes.
        </p>

        <button
          class="text-sm text-hogaan-mute hover:text-hogaan-text transition underline underline-offset-4"
        >
          Didn't get it? Send again
        </button>

        <div class="mt-10 pt-6 border-t border-hogaan-sunken">
          <p class="text-xs text-hogaan-soft leading-relaxed">
            Trouble signing in? Email
            <a href="mailto:hello@hogaan.com" class="text-hogaan-accent hover:underline"
              >hello@hogaan.com</a
            >
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto px-6 py-6 w-full text-center text-xs text-hogaan-soft">
      <span class="font-display font-semibold text-hogaan-mute">Hogaan</span>
      <span class="mx-2">·</span>
      A
      <a href="https://hamsewarfa.com" class="text-hw-blue hover:underline">Hamse Warfa</a> product
    </footer>
  </body>
</html>
