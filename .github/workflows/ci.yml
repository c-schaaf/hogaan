name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, unit + routes + web tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # F10 (beta pre-flight): every test job the launch-readiness handout
      # cites as proof must be enforced on every PR. Pre-fix CI only ran
      # `pnpm test` — `test:routes` and `test:web` existed but were not
      # gated, so a chat-route regression could merge silently. Each job
      # runs separately for clearer failure attribution.
      - name: Unit tests (backend)
        run: pnpm test

      - name: Route integration tests
        run: pnpm test:routes

      - name: Web (frontend) tests
        run: pnpm test:web

      - name: Build
        run: pnpm build

  # E2E (Playwright) runs in its own job so the heavier browser-based suite
  # doesn't block fast feedback on lint/typecheck/unit. Still required to pass
  # before merge — wire as a required check in branch protection.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
